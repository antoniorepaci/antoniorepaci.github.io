<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Indice</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Marcellus&display=swap');

:root{
  --night-top:#0a0e1f;
  --night-glow:#3a2350;
  --gold:#cda45e;
  --gold-bright:#f0cf8a;
  --ember:#e8623c;
  --ember-soft:#ff8a4c;
  --cream:#f4ecdd;
  --card-bg:rgba(10,10,20,0.55);
}

*{box-sizing:border-box; margin:0; padding:0;}

html,body{
  width:100%;
  min-height:100vh;
  min-height:100dvh;
  background:var(--night-top);
  font-family:'Cormorant Garamond', serif;
  color:var(--cream);
  overflow-x:hidden;
}

.stage{
  position:relative;
  width:100%;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:60px 22px;
  text-align:center;
  background:
    radial-gradient(ellipse 900px 600px at 50% 18%, var(--night-glow) 0%, transparent 60%),
    linear-gradient(180deg, var(--night-top) 0%, #100a26 45%, #1a1030 75%, #060309 100%);
}

.stars{
  position:absolute; top:0; left:0; right:0; bottom:0;
  pointer-events:none;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 15%, rgba(244,236,221,0.9), transparent),
    radial-gradient(1px 1px at 25% 8%, rgba(244,236,221,0.7), transparent),
    radial-gradient(1.5px 1.5px at 40% 22%, rgba(244,236,221,0.8), transparent),
    radial-gradient(1px 1px at 62% 10%, rgba(244,236,221,0.6), transparent),
    radial-gradient(1.5px 1.5px at 78% 18%, rgba(244,236,221,0.9), transparent),
    radial-gradient(1px 1px at 88% 6%, rgba(244,236,221,0.6), transparent),
    radial-gradient(1.5px 1.5px at 55% 30%, rgba(244,236,221,0.5), transparent),
    radial-gradient(1px 1px at 8% 32%, rgba(244,236,221,0.5), transparent);
  animation: twinkleStars 5s ease-in-out infinite alternate;
}
@keyframes twinkleStars{ from{opacity:.6;} to{opacity:1;} }

.eyebrow{
  position:relative; z-index:2;
  font-family:'Marcellus', serif;
  letter-spacing:0.3em;
  font-size:11px;
  color:var(--gold);
  text-transform:uppercase;
  margin-bottom:14px;
  opacity:0;
  animation: fadeDown .9s ease forwards .1s;
}

h1{
  position:relative; z-index:2;
  font-family:'Marcellus', serif;
  font-weight:400;
  font-size:clamp(30px, 7vw, 48px);
  letter-spacing:0.01em;
  color:var(--cream);
  text-shadow:0 0 30px rgba(240,207,138,0.25);
  opacity:0;
  animation: fadeDown 1s ease forwards .25s;
}
h1 em{
  font-style:italic;
  color:var(--gold-bright);
}

.subline{
  position:relative; z-index:2;
  margin-top:12px;
  font-size:17px;
  font-style:italic;
  color:rgba(244,236,221,0.7);
  max-width:360px;
  opacity:0;
  animation: fadeDown 1s ease forwards .4s;
}

.countdown{
  position:relative; z-index:2;
  margin-top:26px;
  display:flex;
  gap:18px;
  opacity:0;
  animation: fadeDown 1s ease forwards .48s;
}
.countdown-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  min-width:52px;
}
.countdown-num{
  font-family:'Marcellus', serif;
  font-size:clamp(22px, 5vw, 30px);
  color:var(--gold-bright);
  text-shadow:0 0 20px rgba(240,207,138,0.25);
  font-variant-numeric:tabular-nums;
}
.countdown-label{
  margin-top:4px;
  font-family:'Marcellus', serif;
  font-size:10px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:rgba(205,164,94,0.7);
}

.links{
  position:relative; z-index:2;
  width:min(420px, 100%);
  margin-top:38px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.link-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  border:1px solid rgba(205,164,94,0.35);
  background:var(--card-bg);
  backdrop-filter:blur(6px);
  padding:18px 22px;
  text-decoration:none;
  color:inherit;
  opacity:0;
  animation: fadeDown .8s ease forwards;
}
.link-card:nth-of-type(1){animation-delay:.55s;}
.link-card:nth-of-type(2){animation-delay:.7s;}
.link-card:nth-of-type(3){animation-delay:.85s;}

.link-text{
  text-align:left;
}
.link-title{
  font-family:'Marcellus', serif;
  font-size:14px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--gold-bright);
  display:block;
  margin-bottom:4px;
}
.link-desc{
  font-size:16px;
  font-style:italic;
  color:rgba(244,236,221,0.75);
}

.arrow{
  width:11px; height:11px;
  border-right:1px solid var(--gold);
  border-top:1px solid var(--gold);
  transform:rotate(45deg);
  flex-shrink:0;
}

.link-card.locked{
  opacity:0.45 !important;
  cursor:not-allowed;
}
.link-card.locked .arrow{
  border-color:rgba(205,164,94,0.4);
}

.footer{
  position:relative; z-index:2;
  margin-top:44px;
  font-family:'Marcellus', serif;
  font-size:10px;
  letter-spacing:0.24em;
  text-transform:uppercase;
  color:rgba(205,164,94,0.55);
  opacity:0;
  animation: fadeDown .9s ease forwards 1s;
}
.footer .line{
  width:50px; height:1px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
  margin:0 auto 12px;
}

@keyframes fadeDown{
  from{opacity:0; transform:translateY(-12px);}
  to{opacity:1; transform:translateY(0);}
}

@media (max-width:390px){
  .stage{ padding:44px 16px; }
  .subline{ font-size:15px; }
  .link-card{ padding:15px 16px; }
  .link-title{ font-size:12px; }
  .link-desc{ font-size:15px; }
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; animation-iteration-count:1 !important;}
}
</style>
</head>
<body>

<div class="stage">
  <div class="stars"></div>

  <div class="eyebrow">Archivio segreto</div>
  <h1><em>Frammenti</em> di una notte</h1>
  <h1>Da trovare <em>dentro un giorno</em></h1>
  <p class="subline">Ogni pagina custodisce una parte del mistero.</p>

  <div class="countdown" id="countdown" aria-live="polite">
    <div class="countdown-item">
      <span class="countdown-num" id="cd-days">00</span>
      <span class="countdown-label">Giorni</span>
    </div>
    <div class="countdown-item">
      <span class="countdown-num" id="cd-hours">00</span>
      <span class="countdown-label">Ore</span>
    </div>
    <div class="countdown-item">
      <span class="countdown-num" id="cd-mins">00</span>
      <span class="countdown-label">Min</span>
    </div>
    <div class="countdown-item">
      <span class="countdown-num" id="cd-secs">00</span>
      <span class="countdown-label">Sec</span>
    </div>
  </div>

  <div class="links">
    <a class="link-card" href="messaggio_gn2508.html">
      <span class="link-text">
        <span class="link-title">Cap 0. Buonanotte</span>
        <span class="link-desc">Catania custodisce un segreto</span>
      </span>
      <span class="arrow"></span>
    </a>

    <a class="link-card" href="messaggio_gm2608.html">
      <span class="link-text">
        <span class="link-title">Cap 1. Buongiorno</span>
        <span class="link-desc">L'alba del giorno del mistero</span>
      </span>
      <span class="arrow"></span>
    </a>


  </div>

  <div class="footer">
    <div class="line"></div>
    Un evento irripetibile
  </div>
</div>

<script>
(function(){
  var target = new Date(2026, 7, 27, 0, 0, 0); // 27/08/2026 00:00:00 (ora locale)
  var elDays = document.getElementById('cd-days');
  var elHours = document.getElementById('cd-hours');
  var elMins = document.getElementById('cd-mins');
  var elSecs = document.getElementById('cd-secs');
  var elWrap = document.getElementById('countdown');

  function pad(n){ return String(n).padStart(2, '0'); }

  function tick(){
    var diff = target.getTime() - Date.now();
    if (diff <= 0){
      elDays.textContent = '00';
      elHours.textContent = '00';
      elMins.textContent = '00';
      elSecs.textContent = '00';
      clearInterval(timer);
      return;
    }
    var totalSeconds = Math.floor(diff / 1000);
    var days = Math.floor(totalSeconds / 86400);
    var hours = Math.floor((totalSeconds % 86400) / 3600);
    var mins = Math.floor((totalSeconds % 3600) / 60);
    var secs = totalSeconds % 60;

    elDays.textContent = pad(days);
    elHours.textContent = pad(hours);
    elMins.textContent = pad(mins);
    elSecs.textContent = pad(secs);
  }

  tick();
  var timer = setInterval(tick, 1000);
})();

(function(){
  // Orario di sblocco per ciascun capitolo:
  //  - null   -> nessuna restrizione, sempre disponibile
  //  - Date   -> disponibile a partire da quella data/ora locale
  //  - 'TBD'  -> bloccato a tempo indeterminato (data ancora da decidere)
  var unlocks = {
    'messaggio_gn2508.html': null,
    'messaggio_gm2608.html': new Date(2026, 7, 26, 7, 0, 0), // 26/08/2026 07:00
    'invito_compleanno.html': 'TBD'
  };

  var months = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];

  function pad(n){ return String(n).padStart(2, '0'); }

  function formatUnlock(date){
    return pad(date.getDate()) + '/' + months[date.getMonth()] + ' · ' + pad(date.getHours()) + ':' + pad(date.getMinutes());
  }

  var cards = document.querySelectorAll('.link-card');
  cards.forEach(function(card){
    var href = card.getAttribute('href');
    if (!Object.prototype.hasOwnProperty.call(unlocks, href)) return;

    var unlock = unlocks[href];
    if (unlock === null) return; // nessuna restrizione

    var isLocked = (unlock === 'TBD') || (unlock.getTime() > Date.now());
    if (!isLocked) return;

    card.classList.add('locked');
    card.removeAttribute('href');
    card.setAttribute('aria-disabled', 'true');
    card.setAttribute('tabindex', '-1');

    var desc = card.querySelector('.link-desc');
    if (desc){
      desc.textContent = (unlock === 'TBD') ? 'Prossimamente' : ('Disponibile dal ' + formatUnlock(unlock));
    }
  });
})();
</script>

</body>
</html>
